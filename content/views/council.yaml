id: council
title: Woran arbeitet der Rat?
description: Aktuelle kommunale Themen, ihr Bearbeitungsstand und ihre Quellen.
route: /topics
visibility: published

sources:
  - id: active-topics
    dataset: topics
    filter:
      visibility:
        - published
      status:
        - consultation
        - committee
        - council
        - decided
        - implementation
        - paused
    sort:
      - field: dates.updatedAt
        direction: descending
      - field: title
        direction: ascending

presentation:
  type: list
  source: active-topics
  preset: council-topic-list
  facets:
    - status
    - categories
