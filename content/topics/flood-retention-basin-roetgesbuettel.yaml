id: flood-retention-basin-roetgesbuettel
title: Hochwasserrückhaltebecken an der Rötgesbütteler Riede
summary: >
  Beim Bau des Hochwasserrückhaltebeckens entstanden Mehrkosten; der Rat
  bewilligte dafür im September 2025 zusätzlich 50.000 Euro.
status: implementation
