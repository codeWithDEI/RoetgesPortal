title: Schulentwicklungsplanung 2025 bis 2031
summary: >
  Die fortgeschriebene Schulentwicklungsplanung erwartet für Rötgesbüttel im
  Betrachtungszeitraum ausreichende Räume und beschreibt die Entwicklung der
  Schülerzahlen in der gesamten Samtgemeinde.
