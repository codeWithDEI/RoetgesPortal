id: pfaenderweg-rail-crossing
title: Bahnübergang am Pfänderweg
summary: >
  Die Gemeinde hält einen Bahnübergang weiterhin für notwendig. Der Rat
  beauftragte Gespräche über Alternativen, falls die bisherige Lösung wegen fehlender
  Sichtflächen nicht weiterverfolgt werden kann.
