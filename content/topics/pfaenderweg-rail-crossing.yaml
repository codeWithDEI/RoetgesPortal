id: pfaenderweg-rail-crossing
title: Bahnübergang am Pfänderweg
summary: >
  Die Gemeinde hält einen Bahnübergang weiterhin für notwendig und sucht mit
  der Bahn nach Alternativen, falls die bisherige Lösung wegen fehlender
  Sichtflächen nicht weiterverfolgt werden kann.
