id: glass-container-relocation
title: Neuer Standort für die Glascontainer
summary: >
  Der Landkreis lehnt die geprüften Standorte an der K48 aus Gründen der
  Verkehrssicherheit ab. Die Verwaltung schlägt erneut den Festplatz an der
  Hauptstraße 13 vor.
