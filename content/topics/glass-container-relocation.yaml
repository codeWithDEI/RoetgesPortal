id: glass-container-relocation
title: Neuer Standort für die Glascontainer
summary: >
  Der Rat hat die Parkfläche auf der Nordostseite der Bürgerhalle als
  Übergangsstandort beschlossen. Die Versetzung steht unter dem Vorbehalt
  der Abstimmung mit dem Entsorgungsunternehmen; eine Umsetzung ist nicht belegt.
