title: Sanierung und Modernisierung des Gemeindesportzentrums
summary: >
  Der Sanierungsbedarf des Gemeindesportzentrums soll 2026 durch ein Gutachten
  untersucht und für die Haushaltsberatungen 2027 vorbereitet werden.
