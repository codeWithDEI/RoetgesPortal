id: fire-service-procurements-2026
title: Neue Fahrzeuge und Ausrüstung für die Gemeindefeuerwehr
summary: >
  Vier Beschaffungs- und Fahrzeugvorlagen für die Gemeindefeuerwehr sollen am
  3. September 2026 im Feuerschutzausschuss beraten werden.
