title: Nebenanlagen an der B4-Ortsdurchfahrt
summary: >
  Laut Bürgermeisterbericht vom 22. September 2026 sind Förderanträge
  für die westlichen Gehwege gestellt; Querungshilfe und Gehwegarbeiten
  bleiben vorgesehen. Der B4-Baubeginn ist für Frühjahr 2027 angekündigt.
