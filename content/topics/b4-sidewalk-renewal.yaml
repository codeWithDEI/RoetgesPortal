id: b4-sidewalk-renewal
title: Nebenanlagen an der B4-Ortsdurchfahrt
summary: >
  Entlang der B4 sollen Gehwege und der Festplatzbereich erneuert, Parkplätze
  ergänzt und eine vom Land finanzierte Querungshilfe gebaut werden.
