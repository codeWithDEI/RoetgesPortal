id: fire-command-vehicle-roetgesbuettel
title: Mannschaftstransportwagen für die Ortsfeuerwehr
summary: >
  Für die Ortsfeuerwehr Rötgesbüttel soll ein gebrauchter
  Mannschaftstransportwagen beschafft werden; der vorhandene Mercedes Vito
  bleibt als Zugführungsfahrzeug im Einsatz.
