id: northern-town-sign-relocation
title: Versetzung des Ortsschildes am nördlichen Ortseingang
summary: >
  Das Ortsschild soll im Zuge der für 2027 vorgesehenen B4-Sanierung nördlich
  der Ampelanlage Pfänderweg versetzt werden.
