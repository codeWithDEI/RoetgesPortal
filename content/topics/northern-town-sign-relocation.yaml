id: northern-town-sign-relocation
title: Versetzung des Ortsschildes am nördlichen Ortseingang
summary: >
  Laut Bürgermeisterbericht vom 1. Juni 2026 hat der Landkreis der
  Versetzung des nördlichen Ortsschildes nach der B4-Baumaßnahme zugestimmt.
  Eine bereits erfolgte Versetzung des Ortsschildes wird nicht berichtet.
