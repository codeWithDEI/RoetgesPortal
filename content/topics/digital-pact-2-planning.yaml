id: digital-pact-2-planning
title: Vorbereitung auf den Digitalpakt 2.0
summary: >
  Für die Vorbereitung von Digitalisierungsprojekten an den Schulen wurden
  30.000 Euro Planungskosten in den Haushalt 2026 aufgenommen.
status: implementation
