id: sports-facilities-usage-rules
title: Benutzung der samtgemeindeeigenen Sportstätten
summary: >
  Die Samtgemeinde hat ihre Benutzungssatzung für Sportstätten neu gefasst
  und dabei unter anderem den Neubau der Turnhalle in Vordorf berücksichtigt.
status: decided
visibility: published

