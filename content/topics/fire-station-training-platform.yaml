title: Übungsplattform im Feuerwehrhaus Rötgesbüttel
summary: >
  In der Fahrzeughalle des neuen Feuerwehrhauses soll für rund 23.000 Euro
  eine statisch berechnete Arbeits- und Übungsplattform entstehen.
