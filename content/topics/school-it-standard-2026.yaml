id: school-it-standard-2026
title: Neuer IT-Ausstattungsstandard für Grundschulen
summary: >
  Seit 2026 gilt für die Grundschulen ein neuer gemeinsamer Standard mit
  Mediaboards, mobilen Endgeräten, zentraler Verwaltung und erneuerter
  Netzwerkinfrastruktur.
status: implementation
visibility: published

