id: winter-service-agreement
title: Ergänzungsvereinbarung zum Winterdienst
summary: >
  Die Vereinbarung über Räum- und Streudienste in den Ortslagen wird wegen
  der Umsatzsteuerpflicht öffentlicher Leistungen ab 2027 ergänzt.
status: decided
visibility: published

