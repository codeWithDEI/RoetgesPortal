id: central-childcare-responsibility-review
title: Prüfung einer zentralen Kita-Zuständigkeit
summary: >
  Der Rat beschloss, bei der Samtgemeinde eine Prüfung zur Bündelung von
  Kita-Aufgaben zu beantragen. Ob die Samtgemeinde die Prüfung aufgenommen
  hat, geht aus der verlinkten Quelle nicht hervor.
