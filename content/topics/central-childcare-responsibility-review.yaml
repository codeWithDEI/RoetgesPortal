id: central-childcare-responsibility-review
title: Prüfung einer zentralen Kita-Zuständigkeit
summary: >
  Rötgesbüttel hat bei der Samtgemeinde eine Prüfung beantragt, ob
  Kita-Aufgaben zentral gebündelt werden können; ein öffentliches Ergebnis
  ist noch nicht dokumentiert.
