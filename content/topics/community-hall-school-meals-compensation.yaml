id: community-hall-school-meals-compensation
title: Entschädigung für die Mensanutzung der Bürgerhalle
summary: >
  Wegen des zusätzlichen Ganztags am Freitag wurde eine jährliche
  Nutzungsausfallentschädigung von 3.000 Euro ab 2027 vorgeschlagen; die
  abschließende Vereinbarung steht noch aus.
