title: Entschädigung für die Mensanutzung der Bürgerhalle
summary: >
  Der Schulausschuss empfahl jährlich 3.000 Euro Entschädigung ab 2027 für
  die Mensanutzung am Freitag und die Vorbereitung einer Änderungsvereinbarung.
  Ein abschließender Vertrag ist durch die verlinkten Quellen nicht belegt.
