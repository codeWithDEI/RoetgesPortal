id: rodelberg-development
title: Weitere Nutzung der Fläche Rodelberg
summary: >
  Für die gemeindeeigene Fläche am Rodelberg wurde eine Wohnnutzung geprüft;
  wirtschaftliche und technische Hindernisse bestehen fort.
status: open
statusBasis:
  scope: topic
  summary: >
    Die weitere Nutzung bleibt ungeklärt: Hindernisse bestehen fort und nur
    eine untersuchte Alternative wurde abgelehnt.
  sourceUrl: https://www.papenteich.sitzung-online.de/public/to020?TOLFDNR=1005884&SILFDNR=1000260
latestDecision:
  date: "2026-03-17"
  body: Rat der Gemeinde Rötgesbüttel
  outcome: rejected
  summary: >
    Der Rat lehnte den Auftrag für eine alternative Planung von zwei bis drei
    Grundstücken ab; über die weitere Nutzung der gesamten Fläche wurde damit
    nicht abschließend entschieden.
  sourceUrl: https://www.papenteich.sitzung-online.de/public/to020?TOLFDNR=1005884&SILFDNR=1000260
