id: rodelberg-development
title: Weitere Nutzung der Fläche Rodelberg
summary: >
  Für die gemeindeeigene Fläche am Rodelberg wurde eine Wohnnutzung geprüft;
  wirtschaftliche und technische Hindernisse bestehen fort.
status: paused
