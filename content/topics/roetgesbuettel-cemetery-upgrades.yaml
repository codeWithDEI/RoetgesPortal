id: roetgesbuettel-cemetery-upgrades
title: Verbesserungen am Friedhof Rötgesbüttel
summary: >
  Für eine zweite Stele an der Gemeinschaftsgrabanlage und die Instandsetzung
  der Parkplätze wurden zusätzliche Haushaltsmittel bereitgestellt.
