title: Gemeinschafts- und Bürgerservicezentrum an der alten Feuerwehr
summary: >
  Der Bereich der alten Feuerwehr soll zu einer multifunktionalen
  Gemeinschaftseinrichtung mit Bürgerservice umgebaut werden.
