id: primary-school-youth-welfare-agreement
title: Vereinbarung zur Ganztagsförderung von Grundschulkindern
summary: >
  Die Samtgemeinde übernimmt auf Grundlage einer Vereinbarung mit dem
  Landkreis Aufgaben zur Umsetzung des Rechtsanspruchs auf Ganztagsförderung.
