id: childcare-centre-expansion
title: Erweiterung der Kindertagesstätte
summary: >
  Für die Kindertagesstätte werden Erweiterungs- und Nutzungsmöglichkeiten
  unter den aktuellen Genehmigungsanforderungen geprüft.
