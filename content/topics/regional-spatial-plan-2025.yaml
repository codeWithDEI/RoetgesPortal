id: regional-spatial-plan-2025
title: Stellungnahme zum Regionalen Raumordnungsprogramm 2025
summary: >
  Die Gemeinde hat zum Entwurf des Regionalen Raumordnungsprogramms Stellung
  genommen und Änderungen zur Baulandplanung und zu einer Photovoltaikfläche
  gefordert.
