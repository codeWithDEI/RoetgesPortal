id: municipal-heat-planning
title: Kommunale Wärmeplanung für den Papenteich
summary: >
  Laut Rötgesbütteler Bürgermeisterbericht vom 22. September 2026 hat
  die Samtgemeinde Ingenieurleistungen für die Wärmeplanung ausgeschrieben
  und Bietergespräche geführt. Die Vergabe wird darin erst angekündigt.
status: implementation
