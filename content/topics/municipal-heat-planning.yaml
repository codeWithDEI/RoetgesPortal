title: Kommunale Wärmeplanung für den Papenteich
summary: >
  Die Samtgemeinde hat für die kommunale Wärmeplanung 90.000 Euro im
  Finanzplanjahr 2026 vorgesehen; vor der Beauftragung soll der Arbeitskreis
  Klima und Energie beteiligt werden.
