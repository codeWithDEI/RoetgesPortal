id: community-hall-fees
title: Gebühren für Bürgerhalle und Gemeinschaftsräume
summary: >
  Eine Neufassung der Gebühren für Bürgerhalle, Gemeinschaftsräume und
  Festplatz wurde beraten; die weiteren Beratungen in Verwaltungsausschuss
  und Rat sind derzeit gestoppt.
