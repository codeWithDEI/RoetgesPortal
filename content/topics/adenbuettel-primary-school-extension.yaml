id: adenbuettel-primary-school-extension
title: Erweiterung der Grundschule Adenbüttel
summary: >
  Ein Entwurf sieht einen neuen Unterrichtsraum, eine größere Mensa und
  einen Differenzierungsraum vor. Veranschlagt sind 762.000 Euro; die
  Ausschussberatungen stehen noch aus.
