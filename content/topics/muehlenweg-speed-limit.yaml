title: Antrag auf Tempo 70 auf dem Mühlenweg
summary: >
  Laut Bürgermeisterbericht vom 17. März 2026 hat der Landkreis die
  beantragte Geschwindigkeitsreduzierung auf dem Mühlenweg negativ beschieden.
  Der Rat hatte zuvor einen Antrag auf Tempo 70 beschlossen.
