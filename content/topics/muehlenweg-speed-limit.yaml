id: muehlenweg-speed-limit
title: Geschwindigkeitsbegrenzung auf dem Mühlenweg
summary: >
  Die Gemeinde hat beim Landkreis eine Reduzierung der zulässigen
  Höchstgeschwindigkeit auf dem Mühlenweg von 100 auf 70 km/h beantragt.
status: implementation
visibility: published

