id: all-day-primary-schools-2026
title: Fünftägiger Ganztag an den Grundschulen
summary: >
  Seit dem Schuljahr 2026/27 bieten alle Grundschulen im Papenteich an fünf
  Tagen offenen Ganztag an; der Rechtsanspruch wird bis 2029/30 stufenweise
  auf alle Klassen ausgeweitet.
