id: all-day-primary-schools-2026
title: Fünftägiger Ganztag an den Grundschulen
summary: >
  Der Bericht vom Juni 2026 dokumentiert Vorbereitungen für offenen Ganztag
  an fünf Tagen an allen Grundschulen. Den angekündigten Betriebsstart im
  August bestätigt diese Quelle noch nicht.
status: implementation
