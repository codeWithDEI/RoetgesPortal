id: aukenroth-residential-development
title: Wohngebiet Aukenroth
summary: >
  Die frühzeitige Beteiligung zum Wohngebiet Aukenroth ist abgeschlossen.
  Nun soll die öffentliche Auslegung mit erneuter Behördenbeteiligung
  vorbereitet werden.
