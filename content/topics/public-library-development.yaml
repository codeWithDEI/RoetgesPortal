title: Weiterentwicklung der Samtgemeindebücherei
summary: >
  Nach einer Bürgerbefragung liegt ein konkreter Stufenplan für einen größeren,
  barrierefreien Standort, mehr Personal, Medien und digitale Angebote vor.
