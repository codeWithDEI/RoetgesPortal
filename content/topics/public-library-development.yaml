id: public-library-development
title: Weiterentwicklung der Samtgemeindebücherei
summary: >
  Die Bücherei soll räumlich, personell und digital weiterentwickelt werden;
  die Verwaltung erarbeitet dafür ein Umsetzungs- und Finanzkonzept.
status: implementation
