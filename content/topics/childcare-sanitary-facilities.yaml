summary: >
  Laut Bürgermeisterbericht vom 22. September 2026 haben Architekt, DRK
  und Kita-Leitung die Sanitärräume der Igelgruppe besichtigt. Ein Konzept
  wird erarbeitet; begonnene Sanierungsarbeiten sind nicht bestätigt.
