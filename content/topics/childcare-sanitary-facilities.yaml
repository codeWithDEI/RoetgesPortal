  scope: topic
  summary: >
    Der Rat beschloss die Vorbereitung eines Konzepts beziehungsweise Beratung durch das
    DRK. Ein Beginn der Sanierungsarbeiten ist damit nicht belegt.
  sourceUrl: https://www.papenteich.sitzung-online.de/public/to020?TOLFDNR=1006190&SILFDNR=1000260
