id: childcare-sanitary-facilities
title: Sanierung der Sanitärräume in der Kindertagesstätte
summary: >
  Für noch nicht umgestaltete Sanitärräume der Kindertagesstätte soll ein
  Sanierungskonzept entstehen.
status: open
