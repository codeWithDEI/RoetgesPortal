id: cemetery-community-graves-program
title: Gemeinschaftsgrabanlagen auf den Friedhöfen
summary: >
  Für neue oder erweiterte Gemeinschaftsgrabanlagen sollen von 2027 bis 2029
  jährlich 20.000 Euro bereitstehen; die Reihenfolge richtet sich nach Bedarf
  und verfügbaren Flächen.
status: decided
statusBasis:
  scope: topic
  summary: >
    Der Samtgemeinderat beschloss die Mittel für 2027 bis 2029 und überließ
    der Verwaltung die Reihenfolge nach Bedarf. Dies belegt das Programm,
    nicht den Baubeginn einzelner Anlagen.
  sourceUrl: https://www.papenteich.sitzung-online.de/public/to020?TOLFDNR=1003863&SILFDNR=1954
