id: cemetery-community-graves-program
title: Gemeinschaftsgrabanlagen auf den Friedhöfen
summary: >
  Für neue oder erweiterte Gemeinschaftsgrabanlagen sollen von 2027 bis 2029
  jährlich 20.000 Euro bereitstehen; die Reihenfolge richtet sich nach Bedarf
  und verfügbaren Flächen.
