name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check Python source
        run: python -m compileall -q tools tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate editorial content
        run: python tools/validate_content.py

      - name: Validate deployment configuration
        run: python -c "import pathlib, yaml; yaml.safe_load(pathlib.Path('deploy/compose.yaml').read_text())"

      - name: Build portal runtime artifacts
        run: python tools/build_portal.py

      - name: Verify generated exports are current
        run: git diff --exit-code -- generated

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build web application
        working-directory: web
        run: pnpm build

      - name: Test web application
        working-directory: web
        run: pnpm test

      - name: Lint web application
        working-directory: web
        run: pnpm lint

      - name: Verify synchronized web data is current
        run: git diff --exit-code -- web/public/data
