name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python source
        run: python -m compileall -q tools

      - name: Rebuild historic map exports
        run: python tools/import_roetgesmarkt.py

      - name: Verify generated exports are current
        run: git diff --exit-code -- generated

      - name: Validate JSON and GeoJSON syntax
        run: |
          python -m json.tool schemas/topic.schema.json > /dev/null
          python -m json.tool content/locations/roetgesmarkt_input.geojson > /dev/null
          python -m json.tool generated/roetgesmarkt_upload.geojson > /dev/null
