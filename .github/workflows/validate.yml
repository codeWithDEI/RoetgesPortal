name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check Python source
        run: python -m compileall -q tools

      - name: Validate editorial content
        run: python tools/validate_content.py

      - name: Rebuild historic map exports
        run: python tools/import_roetgesmarkt.py

      - name: Verify generated exports are current
        run: git diff --exit-code -- generated
