name: Preview content monitor

on:
  workflow_dispatch:
    inputs:
      lookback_months:
        description: Months to inspect, including the current month
        required: true
        default: "2"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "6"

permissions:
  contents: read

concurrency:
  group: content-monitor-preview
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install scanner dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Scan public meeting agendas
        run: >-
          python tools/scan_sitzung_online.py
          --months "${{ inputs.lookback_months }}"
          --report content-monitor-report.md

      - name: Validate review queue
        run: python tools/validate_content.py

      - name: Prepare review artifact
        run: |
          git diff -- content/review/sitzung-online.yaml > content-monitor.diff
          cat content-monitor-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: content-monitor-review
          retention-days: 14
          if-no-files-found: error
          path: |
            content/review/sitzung-online.yaml
            content-monitor-report.md
            content-monitor.diff
