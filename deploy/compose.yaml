name: roetgesportal

services:
  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - backend

  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:-http://localhost}"
      CANONICAL_ORIGIN: "${CANONICAL_ORIGIN:-http://localhost}"
      REDIRECT_SITE_ADDRESSES: "${REDIRECT_SITE_ADDRESSES:-http://localhost:8081}"
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
      - "${HTTPS_PORT:-8443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
      - backend

volumes:
  caddy_data:
  caddy_config:

networks:
  edge:
  backend:
    internal: true
