name: roetgesportal

services:
  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    restart: unless-stopped
    environment:
      LEGAL_OPERATOR_NAME: "${LEGAL_OPERATOR_NAME:?Set LEGAL_OPERATOR_NAME in deploy/.env}"
      LEGAL_OPERATOR_STREET: "${LEGAL_OPERATOR_STREET:?Set LEGAL_OPERATOR_STREET in deploy/.env}"
      LEGAL_OPERATOR_POSTAL_CODE: "${LEGAL_OPERATOR_POSTAL_CODE:?Set LEGAL_OPERATOR_POSTAL_CODE in deploy/.env}"
      LEGAL_OPERATOR_CITY: "${LEGAL_OPERATOR_CITY:?Set LEGAL_OPERATOR_CITY in deploy/.env}"
      LEGAL_CONTACT_EMAIL: "${LEGAL_CONTACT_EMAIL:?Set LEGAL_CONTACT_EMAIL in deploy/.env}"
      LEGAL_HOSTING_PROVIDER_NAME: "${LEGAL_HOSTING_PROVIDER_NAME:?Set LEGAL_HOSTING_PROVIDER_NAME in deploy/.env}"
      LEGAL_HOSTING_PROCESSING_LOCATIONS: "${LEGAL_HOSTING_PROCESSING_LOCATIONS:?Set LEGAL_HOSTING_PROCESSING_LOCATIONS in deploy/.env}"
      LEGAL_HOSTING_RETENTION_INFORMATION: "${LEGAL_HOSTING_RETENTION_INFORMATION:?Set LEGAL_HOSTING_RETENTION_INFORMATION in deploy/.env}"
      LEGAL_HOSTING_THIRD_COUNTRY_INFORMATION: "${LEGAL_HOSTING_THIRD_COUNTRY_INFORMATION:?Set LEGAL_HOSTING_THIRD_COUNTRY_INFORMATION in deploy/.env}"
      LEGAL_EMAIL_PROVIDER_NAME: "${LEGAL_EMAIL_PROVIDER_NAME:?Set LEGAL_EMAIL_PROVIDER_NAME in deploy/.env}"
      LEGAL_EMAIL_PROCESSING_LOCATIONS: "${LEGAL_EMAIL_PROCESSING_LOCATIONS:?Set LEGAL_EMAIL_PROCESSING_LOCATIONS in deploy/.env}"
      LEGAL_EMAIL_THIRD_COUNTRY_INFORMATION: "${LEGAL_EMAIL_THIRD_COUNTRY_INFORMATION:?Set LEGAL_EMAIL_THIRD_COUNTRY_INFORMATION in deploy/.env}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - backend

  proxy:
    image: caddy:2.11.1-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:-http://localhost}"
      CANONICAL_ORIGIN: "${CANONICAL_ORIGIN:-http://localhost}"
      REDIRECT_SITE_ADDRESSES: "${REDIRECT_SITE_ADDRESSES:-http://localhost:8081}"
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
      - "${HTTPS_PORT:-8443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    networks:
      - edge
      - backend

  analytics:
    image: allinurl/goaccess:1.11
    restart: unless-stopped
    depends_on:
      proxy:
        condition: service_started
    entrypoint:
      - /bin/sh
      - /opt/roetgesportal/update-report.sh
    environment:
      ANALYTICS_REFRESH_SECONDS: "${ANALYTICS_REFRESH_SECONDS:-300}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - ./analytics/update-report.sh:/opt/roetgesportal/update-report.sh:ro
      - caddy_logs:/var/log/caddy:ro
      - analytics_report:/var/www/goaccess
    network_mode: none
    healthcheck:
      test:
        - CMD
        - test
        - -s
        - /var/www/goaccess/index.html
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  analytics-dashboard:
    image: busybox:1.37
    restart: unless-stopped
    depends_on:
      analytics:
        condition: service_healthy
    command:
      - httpd
      - -f
      - -p
      - "8080"
      - -h
      - /srv/report
    read_only: true
    user: "65534:65534"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:${ANALYTICS_PORT:-8082}:8080"
    volumes:
      - analytics_report:/srv/report:ro
    networks:
      - edge
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
  analytics_report:

networks:
  edge:
  backend:
    internal: true
